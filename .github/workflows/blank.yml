name: Genesys Cloud CX as Code - Test Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select plan to preview changes or apply to deploy the approved test configuration"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: genesys-cloud-test
  cancel-in-progress: false 

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate_and_test:
    name: Format, Validate and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read 

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: "1.15.8" 

      - name: Display Terraform version
        run: terraform version

      - name: Terraform format check
        run: terraform fmt -check -recursive 

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color 

      - name: Terraform native tests
        run: terraform test -no-color 

  plan:
    name: Plan Test Changes
    needs: validate_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'plan' || inputs.action == 'apply') &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_genesyscloud_region: ${{ vars.GENESYSCLOUD_REGION }}
      TF_VAR_genesyscloud_oauthclient_id: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_ID }}
      TF_VAR_genesyscloud_oauthclient_secret: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_SECRET }}
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }} 

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: "1.15.8" 

      - name: Terraform init with S3 backend
        run: terraform init -input=false 

      - name: Terraform plan
        run: >-
          terraform plan
          -input=false
          -no-color
          -var-file=environments/test/test.tfvars
          -out=tfplan 
      - name: Generate Terraform plan checksum
        run: sha256sum tfplan > tfplan.sha256
 
      - name: Upload Terraform plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: genesys-cloud-test-plan-${{ github.sha }}
          path: |
            tfplan
            tfplan.sha256
          if-no-files-found: error
          retention-days: 1 

  apply: 
    name: Apply to Genesys Cloud Test
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'apply' &&
      github.ref == 'refs/heads/main'
 
    environment:
      name: test
 
    permissions:
      contents: read
      id-token: write
 
    env:
      TF_VAR_genesyscloud_region: ${{ vars.GENESYSCLOUD_REGION }}
      TF_VAR_genesyscloud_oauthclient_id: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_ID }}
      TF_VAR_genesyscloud_oauthclient_secret: ${{ secrets.GENESYSCLOUD_OAUTHCLIENT_SECRET }}
 

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
 
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: "1.15.8" 

      - name: Terraform init with S3 backend
        run: terraform init -input=false
 
      - name: Download Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
        with:
          name: genesys-cloud-test-plan-${{ github.sha }}
          path: . 

      - name: Verify Terraform plan checksum
        run: sha256sum --check tfplan.sha256

      - name: Terraform apply saved plan
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify post-apply state
        shell: bash
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -var-file=environments/test/test.tfvars
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            echo "Post-apply verification passed. No additional changes detected."
            exit 0
          fi
          if [ "$exit_code" -eq 2 ]; then
            echo "Post-apply verification detected additional changes."
            exit 1
          fi
          echo "Post-apply verification failed because Terraform returned an error."
          exit 1
